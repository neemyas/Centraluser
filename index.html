<script>
    const firebaseConfig = {
        apiKey: "SUA_API_KEY_AQUI",
        authDomain: "SEU_PROJETO.firebaseapp.com",
        projectId: "SEU_PROJETO_ID",
        storageBucket: "SEU_PROJETO.appspot.com",
        messagingSenderId: "SEU_SENDER_ID",
        appId: "SEU_APP_ID"
    };

    if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length === 0) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = (typeof firebase !== 'undefined' && firebase.firestore) ? firebase.firestore() : null;

    let estruturaGlobal = { Canais: {}, Filmes: {}, Series: {} };
    let tipoAtual = '';
    let subpastaAtual = '';
    let hlsInstance = null;
    let mpegtsPlayer = null;

    async function carregarListaM3U() {
        let inputTexto = document.getElementById('m3u-input').value.trim();
        if (!inputTexto) {
            alert('Por favor, insira o link ou conteúdo da lista M3U.');
            return;
        }

        let textoM3U = "";
        if (inputTexto.startsWith('http://') || inputTexto.startsWith('https://')) {
            try {
                document.getElementById('canal-reproduzindo').innerText = 'Baixando lista do servidor...';
                
                // Proxy CORS para contornar o bloqueio do GitHub Pages
                let proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(inputTexto);
                let response = await fetch(proxyUrl);
                
                if (!response.ok) throw new Error('Erro na resposta do servidor');
                textoM3U = await response.text();
            } catch (error) {
                alert('Erro ao baixar pelo link. Tente colar o conteúdo do arquivo M3U diretamente.');
                document.getElementById('canal-reproduzindo').innerText = '';
                return;
            }
        } else {
            textoM3U = inputTexto;
        }

        processarTextoM3U(textoM3U);
    }

    function processarTextoM3U(textoM3U) {
        let linhas = textoM3U.split('\n');
        let estrutura = { Canais: {}, Filmes: {}, Series: {} };
        let nomeAtual = "";
        let groupAtual = "Geral";

        for (let i = 0; i < linhas.length; i++) {
            let linha = linhas[i].trim();
            if (linha.startsWith('#EXTINF:')) {
                let partesVirgula = linha.split(',');
                nomeAtual = partesVirgula[partesVirgula.length - 1].trim();

                if (linha.includes('group-title="')) {
                    let match = linha.match(/group-title="([^"]+)"/);
                    if (match && match[1]) groupAtual = match[1].trim();
                }
            } else if (linha && !linha.startsWith('#')) {
                let urlStream = linha;
                let item = { nome: nomeAtual || "Sem Nome", url: urlStream };

                let buscaTipo = (groupAtual + " " + nomeAtual).toLowerCase();
                let destino = 'Canais';

                if (buscaTipo.includes('filme') || buscaTipo.includes('movie') || buscaTipo.includes('vod') || buscaTipo.includes('cinema') || buscaTipo.includes('lançamento')) {
                    destino = 'Filmes';
                } else if (buscaTipo.includes('serie') || buscaTipo.includes('série') || buscaTipo.includes('temporada') || buscaTipo.includes('episodio') || buscaTipo.includes('ep.')) {
                    destino = 'Series';
                }

                if (!estrutura[destino][groupAtual]) {
                    estrutura[destino][groupAtual] = [];
                }
                estrutura[destino][groupAtual].push(item);
            }
        }

        estruturaGlobal = estrutura;
        let totalCanais = Object.values(estrutura.Canais).reduce((acc, curr) => acc + curr.length, 0);
        let totalFilmes = Object.values(estrutura.Filmes).reduce((acc, curr) => acc + curr.length, 0);
        let totalSeries = Object.values(estrutura.Series).reduce((acc, curr) => acc + curr.length, 0);

        document.getElementById('painel-iptv').style.display = 'block';
        document.getElementById('canal-reproduzindo').innerText = '';
        voltarParaTipos();
        alert(`Lista carregada com sucesso!\n- Canais: ${totalCanais}\n- Filmes: ${totalFilmes}\n- Séries: ${totalSeries}`);
    }

    function abrirTipoPrincipal(tipo) {
        tipoAtual = tipo;
        document.getElementById('view-tipos').style.display = 'none';
        document.getElementById('view-subpastas').style.display = 'block';
        document.getElementById('breadcrumb').innerText = `Início > ${tipo}`;
        
        let subpastas = estruturaGlobal[tipo] || {};
        let divSub = document.getElementById('lista-subpastas');
        let html = '';
        let grupos = Object.keys(subpastas);

        if (grupos.length === 0) {
            divSub.innerHTML = '<p style="color:#aaa; font-size:13px;">Nenhuma subpasta encontrada.</p>';
            return;
        }

        grupos.forEach(grupo => {
            let qtd = subpastas[grupo].length;
            let grupoSeguro = grupo.replace(/'/g, "\\'");
            html += `<div class="folder-card" onclick="abrirSubpasta('${grupoSeguro}')">
                <h4>📁 ${grupo}</h4>
                <span style="font-size:11px; color:#aaa;">(${qtd} itens)</span>
            </div>`;
        });
        divSub.innerHTML = html;
    }

    function abrirSubpasta(grupo) {
        subpastaAtual = grupo;
        document.getElementById('view-subpastas').style.display = 'none';
        document.getElementById('view-itens').style.display = 'block';
        document.getElementById('filtro-busca').style.display = 'block';
        document.getElementById('breadcrumb').innerText = `Início > ${tipoAtual} > ${grupo}`;
        document.getElementById('filtro-busca').value = '';
        renderizarItens(estruturaGlobal[tipoAtual][grupo] || []);
    }

    function voltarParaTipos() {
        tipoAtual = '';
        subpastaAtual = '';
        document.getElementById('view-subpastas').style.display = 'none';
        document.getElementById('view-itens').style.display = 'none';
        document.getElementById('view-tipos').style.display = 'grid';
        document.getElementById('filtro-busca').style.display = 'none';
        document.getElementById('breadcrumb').innerText = 'Início';
        document.getElementById('filtro-busca').value = '';
    }

    function voltarParaSubpastas() {
        subpastaAtual = '';
        document.getElementById('view-itens').style.display = 'none';
        document.getElementById('view-subpastas').style.display = 'block';
        document.getElementById('filtro-busca').style.display = 'none';
        document.getElementById('breadcrumb').innerText = `Início > ${tipoAtual}`;
        document.getElementById('filtro-busca').value = '';
    }

    function renderizarItens(itens) {
        let divLista = document.getElementById('lista-conteudo');
        if (itens.length === 0) {
            divLista.innerHTML = '<p style="color:#aaa; font-size:13px;">Nenhum item encontrado.</p>';
            return;
        }

        let html = '';
        itens.forEach((item) => {
            let nomeSeguro = item.nome.replace(/'/g, "\\'");
            let urlSegura = item.url.replace(/'/g, "\\'");
            html += `<div class="item-lista" onclick="reproduzirStream('${urlSegura}', '${nomeSeguro}')">
                <span>▶ ${item.nome}</span>
                <span style="font-size:11px; color:var(--primary);">Assistir</span>
            </div>`;
        });
        divLista.innerHTML = html;
    }

    function filtrarItens() {
        let termo = document.getElementById('filtro-busca').value.toLowerCase();
        let itensOriginais = estruturaGlobal[tipoAtual][subpastaAtual] || [];
        let filtrados = itensOriginais.filter(i => i.nome.toLowerCase().includes(termo));
        renderizarItens(filtrados);
    }

    function reproduzirStream(url, nome) {
        let video = document.getElementById('web-player');
        document.getElementById('canal-reproduzindo').innerText = 'Reproduzindo: ' + nome;

        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        if (mpegtsPlayer) { mpegtsPlayer.destroy(); mpegtsPlayer = null; }

        if (url.includes('.m3u8') && Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(url);
            hlsInstance.attachMedia(video);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(e => console.log(e));
            });
        } else if (mpegts.getFeatureList().mseLivePlayback) {
            mpegtsPlayer = mpegts.createPlayer({ type: 'mpegts', url: url, isLive: true, cors: true });
            mpegtsPlayer.attachMediaElement(video);
            mpegtsPlayer.load();
            mpegtsPlayer.play().catch(e => console.log(e));
        } else {
            video.src = url;
            video.load();
            video.play().catch(e => alert("Erro ao reproduzir fluxo diretamente."));
        }
    }

    function mudarAba(aba) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section-view').forEach(s => s.classList.remove('active'));

        if (aba === 'cliente') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('view-cliente').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('view-admin').classList.add('active');
        }
    }
</script>
